server.port=8081
spring.application.name=auth-service

# Default: in-memory H2, so nothing needs to be installed. Data is lost on restart.
# For MySQL (Docker stage) start with the profile: SPRING_PROFILES_ACTIVE=mysql
spring.datasource.url=jdbc:h2:mem:uber_auth;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Eureka. Set EUREKA_ENABLED=false to run without the registry.
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# JWT. The default secret is for local use only, override JWT_SECRET anywhere else.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
jwt.expiry-ms=${JWT_EXPIRY_MS:3600000}

management.endpoints.web.exposure.include=health,info
