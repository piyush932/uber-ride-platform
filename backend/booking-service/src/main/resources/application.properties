server.port=8084
spring.application.name=booking-service

# Other services. Override with LOCATION_SERVICE_URL / SOCKET_SERVICE_URL if needed.
location.service.url=${LOCATION_SERVICE_URL:http://localhost:8082}
socket.service.url=${SOCKET_SERVICE_URL:http://localhost:8083}
booking.search.radius-km=${BOOKING_SEARCH_RADIUS_KM:5}

# Driver offers: how long a driver has to answer, how many drivers to try, how often the expiry job runs.
booking.offer.ttl-seconds=${BOOKING_OFFER_TTL_SECONDS:20}
booking.offer.max-attempts=${BOOKING_OFFER_MAX_ATTEMPTS:5}
booking.offer.sweep-ms=${BOOKING_OFFER_SWEEP_MS:2000}

# Default: H2 in memory, so a fresh start needs nothing installed.
# For MySQL start with SPRING_PROFILES_ACTIVE=mysql and DB_PASSWORD set.
spring.datasource.url=jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Events. Default publisher logs to the console; SPRING_PROFILES_ACTIVE=kafka sends to Kafka.
booking.events.topic=${BOOKING_EVENTS_TOPIC:booking-events}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Eureka. Set EUREKA_ENABLED=false to run without the registry.
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
