server.port=8082
spring.application.name=location-service

# Default: in-memory driver store, so nothing needs to be installed.
# For Redis GEO (Docker stage) start with the profile: SPRING_PROFILES_ACTIVE=redis
# A driver that has not sent a position for this many seconds is treated as offline.
location.ttl-seconds=${LOCATION_TTL_SECONDS:300}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
management.health.redis.enabled=false

# Eureka. Set EUREKA_ENABLED=false to run without the registry.
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
