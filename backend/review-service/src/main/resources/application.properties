server.port=8085
spring.application.name=review-service

# Booking service, used to check that a booking is COMPLETED before a review is saved.
booking.service.url=${BOOKING_SERVICE_URL:http://localhost:8084}

# Default: H2 in memory. For MySQL start with SPRING_PROFILES_ACTIVE=mysql and DB_PASSWORD set.
spring.datasource.url=jdbc:h2:mem:reviewdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Eureka. Set EUREKA_ENABLED=false to run without the registry.
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
