server.port=8083
spring.application.name=socket-service

# Where a driver's "accept" is forwarded. The booking service arrives in a later phase.
booking.service.url=${BOOKING_SERVICE_URL:http://localhost:8084}

# Eureka. Set EUREKA_ENABLED=false to run without the registry.
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
